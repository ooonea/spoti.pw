name: Build spoti.pw 0.21.0 one-shot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-spoti-021-once.yml"

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download Spotify 9.1.82 decrypted IPA
        run: |
          mkdir -p ipa
          curl -fsSL "https://filebin.net/x1mwc9hh3hiuurgp/com.spotify.client-9.1.82-Decrypted.ipa" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - name: Build spoti.pw IPA
        run: make release

      - uses: actions/upload-artifact@v5
        with:
          name: spoti.pw-0.21.0-spotify-9.1.82
          path: out/*.ipa
          if-no-files-found: error
